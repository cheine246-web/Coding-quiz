<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz: Coden mit KI & Claude Code</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
      <div class="card hero">
        <div class="hero-icon">🤖</div>
        <h1>Coden mit KI & Claude Code</h1>
        <p class="subtitle">Teste dein Wissen über KI-gestütztes Programmieren, Prompt-Engineering und Claude Code</p>
        <div class="stats-row">
          <div class="stat"><span class="stat-num">15</span><span class="stat-label">Fragen</span></div>
          <div class="stat"><span class="stat-num">5</span><span class="stat-label">Kategorien</span></div>
          <div class="stat"><span class="stat-num">~10</span><span class="stat-label">Minuten</span></div>
        </div>
        <button id="btn-start" class="btn btn-primary">Quiz starten 🚀</button>
        <a href="moto/" class="btn btn-secondary game-link">🏍️ Pause? Spiel FMX King (Motocross-Tricks)</a>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-header">
        <div class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="quiz-meta">
          <span id="question-counter">Frage 1 / 15</span>
          <span id="score-display">Punkte: 0</span>
        </div>
      </div>

      <div class="card question-card">
        <div id="category-badge" class="category-badge"></div>
        <h2 id="question-text"></h2>

        <div id="code-block-wrap" class="code-block-wrap hidden">
          <pre><code id="code-block"></code></pre>
        </div>

        <div id="options-list" class="options-list"></div>

        <div id="feedback-box" class="feedback-box hidden">
          <div id="feedback-icon" class="feedback-icon"></div>
          <div id="feedback-text" class="feedback-text"></div>
          <div id="explanation-text" class="explanation-text"></div>
          <button id="btn-next" class="btn btn-primary">Weiter →</button>
        </div>
      </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen">
      <div class="card result-card">
        <div id="result-emoji" class="result-emoji"></div>
        <h1 id="result-title"></h1>
        <p id="result-subtitle"></p>

        <div class="result-score-ring">
          <svg viewBox="0 0 120 120" class="ring-svg">
            <circle cx="60" cy="60" r="50" class="ring-bg" />
            <circle cx="60" cy="60" r="50" class="ring-fill" id="ring-fill" />
          </svg>
          <div class="ring-label">
            <span id="result-percent">0%</span>
            <span class="ring-sub">Richtig</span>
          </div>
        </div>

        <div id="result-breakdown" class="result-breakdown"></div>

        <div class="result-actions">
          <button id="btn-review" class="btn btn-secondary">Antworten anzeigen 📋</button>
          <button id="btn-restart" class="btn btn-primary">Nochmal spielen 🔄</button>
        </div>
      </div>
    </div>

    <!-- REVIEW SCREEN -->
    <div id="screen-review" class="screen">
      <div class="review-header">
        <button id="btn-back-result" class="btn btn-ghost">← Ergebnis</button>
        <h2>Alle Antworten</h2>
      </div>
      <div id="review-list" class="review-list"></div>
    </div>

  </div>

  <script src="quiz-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
